<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelWire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to enhance the newspaper aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto+Slab:wght@400;700&display=swap');
        
        .newspaper-font {
            font-family: 'Roboto Slab', serif; /* For body text */
        }
        .masthead-font {
            font-family: 'Playfair Display', serif; /* For the main title */
        }
        
        /* Black and white theme setup */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        .newspaper-article {
            border-bottom: 1px solid #444; /* Darker border for separation */
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .newspaper-article:last-child {
            border-bottom: none;
        }

        /* Responsive layout for articles (mimicking columns on desktop) */
        @media (min-width: 1024px) {
            .content-grid {
                column-count: 2;
                column-gap: 40px;
            }
            .article-column {
                break-inside: avoid;
            }
        }

        /* Style for the navigation buttons - Enhanced active state for better touch/mobile UX */
        .nav-button {
            transition: all 0.2s;
        }
        .nav-button:hover, .nav-button.active {
            background-color: #fefefe;
            color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); /* Sharper shadow */
            transform: translateY(-1px); /* Subtle lift on interaction/active */
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="newspaper-font min-h-screen antialiased">

    <!-- Main Container -->
    <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Masthead (Header) -->
        <header class="py-8 border-b-2 border-white mb-4">
            <div class="flex flex-col items-center">
                <p class="text-xs tracking-widest uppercase mb-1 text-gray-400">The Global Cyber Intelligence Dispatch</p>
                <h1 class="masthead-font text-7xl sm:text-8xl font-extrabold tracking-tight">IntelWire</h1>
                <p class="text-xs mt-2 text-gray-400">MONDAY, OCT 27, 2025 | VOLUME XXI | SINCE 2025 | READERSHIP: GLOBAL</p>
            </div>
        </header>

        <!-- Search Bar Added Here -->
        <div class="mb-6">
            <form id="search-form" onsubmit="handleSearch(event)" class="flex justify-center">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search for specific threats, companies, or vulnerabilities..." 
                    class="w-full max-w-xl px-4 py-3 bg-gray-800 text-white rounded-l-md border border-r-0 border-gray-700 focus:ring-1 focus:ring-yellow-400 focus:border-yellow-400"
                >
                <button type="submit" class="px-5 py-3 bg-yellow-400 text-gray-900 font-bold rounded-r-md hover:bg-yellow-300 transition duration-150">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path></svg>
                </button>
            </form>
        </div>
        <!-- End Search Bar -->

        <!-- Navigation -->
        <nav class="sticky top-0 z-10 bg-[#1a1a1a] border-b border-t border-gray-700 py-3 mb-6 shadow-2xl shadow-black">
            <div id="nav-container" class="flex flex-wrap justify-center gap-2 sm:gap-4 text-xs sm:text-sm">
                <button onclick="renderView('latest')" data-view="latest" class="nav-button active uppercase px-3 py-1 border border-white rounded-sm">Latest Cyber Attacks</button>
                <button onclick="renderView('zero-day')" data-view="zero-day" class="nav-button uppercase px-3 py-1 border border-white rounded-sm">Zero Day Attacks</button>
                <button onclick="renderView('ransomware')" data-view="ransomware" class="nav-button uppercase px-3 py-1 border border-white rounded-sm">Ransomware</button>
                <button onclick="renderView('vulnerabilities')" data-view="vulnerabilities" class="nav-button uppercase px-3 py-1 border border-white rounded-sm">Critical Vulnerabilities</button>
                <button onclick="renderView('hacktivism')" data-view="hacktivism" class="nav-button uppercase px-3 py-1 border border-white rounded-sm">Hacktivism</button>
                <button onclick="renderView('regional')" data-view="regional" class="nav-button uppercase px-3 py-1 border border-white rounded-sm">Regional Cyber Threats</button>
                <button onclick="renderView('subscribe')" data-view="subscribe" class="nav-button uppercase px-3 py-1 border border-white rounded-sm font-bold text-yellow-400 border-yellow-400">Subscribe & Alerts</button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="content-area" class="pb-16 pt-4"></main>

        <!-- Footer -->
        <footer class="text-center py-6 border-t border-gray-700 mt-8 text-gray-400 text-xs">
            © 2025 IntelWire. All Rights Reserved. Cyber Intelligence for a Connected World.
        </footer>

    </div>

    <script>
        const contentArea = document.getElementById('content-area');
        const navButtons = document.querySelectorAll('.nav-button');

        // --- GEMINI API CONFIGURATION (Client-Side Schema Definition) ---
        // CRITICAL FIX: Removed apiKey and apiUrl. The call is now routed through the secure proxy: /api/generate
        const API_MODEL = "gemini-2.5-flash-preview-09-2025"; 

        // Define the JSON schema for the structured response
        const ARTICLE_SCHEMA = {
            type: "ARRAY",
            description: "A list of 5 recent cyber security news articles.",
            items: {
                type: "OBJECT",
                properties: {
                    "title": { "type": "STRING", "description": "A punchy, newspaper-style headline about the cyber event." },
                    "date": { "type": "STRING", "description": "The date of the report or event, e.g., 'Oct 28'." },
                    "excerpt": { "type": "STRING", "description": "A concise, single-paragraph summary of the event (maximum 4 sentences)." }
                },
                propertyOrdering: ["title", "date", "excerpt"]
            }
        };

        /**
         * Calls the Secure Serverless Proxy with exponential backoff for content generation.
         * @param {string} userQuery - The prompt for the model.
         * @param {string} systemPrompt - The persona instruction for the model.
         * @returns {Promise<Array<Object>|null>} - Generated articles or null on failure.
         */
        async function generateContent(userQuery, systemPrompt) {
            const MAX_RETRIES = 3;
            let delay = 1000;

            for (let i = 0; i < MAX_RETRIES; i++) {
                try {
                    // Send all necessary config to the secure proxy
                    const proxyPayload = {
                        userQuery: userQuery,
                        systemPrompt: systemPrompt,
                        responseSchema: ARTICLE_SCHEMA,
                        model: API_MODEL
                    };

                    // CRITICAL FIX: Call the secure proxy endpoint
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(proxyPayload)
                    });

                    if (!response.ok) {
                         const errorDetails = await response.text();
                         throw new Error(`Proxy failed: ${response.status} - ${errorDetails.substring(0, 100)}...`);
                    }

                    const result = await response.json();
                    
                    if (result.error) {
                         throw new Error(`Proxy error: ${result.error}`);
                    }

                    // The proxy returns a JSON string, which we must parse
                    const articles = JSON.parse(result.generatedJsonText);
                    return articles;

                } catch (error) {
                    console.error(`Attempt ${i + 1} failed:`, error.message);
                    if (i === MAX_RETRIES - 1) {
                        console.error("Content generation failed after all retries.");
                        return null;
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2; // Exponential backoff
                }
            }
        }

        // --- RENDER FUNCTIONS (Subscription form remains the same) ---

        /**
         * Renders the subscription form page.
         */
        function renderSubscriptionView() {
            contentArea.innerHTML = `
                <div class="max-w-xl mx-auto py-8">
                    <h2 class="text-4xl masthead-font font-bold mb-6 border-b pb-2">SUBSCRIBE FOR REAL-TIME ALERTS</h2>
                    <p class="mb-6 text-gray-300">Receive customized email digests and critical text message alerts whenever a threat matches your specified interests. We prioritize security and never share your data.</p>
                    
                    <form id="subscribe-form" class="space-y-6 bg-gray-900 p-6 rounded-lg border border-gray-700">
                        <div>
                            <label for="email" class="block text-sm font-bold mb-2">EMAIL ADDRESS (For Daily Digest)</label>
                            <input type="email" id="email" required class="w-full px-4 py-3 bg-gray-800 text-white rounded-md border border-gray-700 focus:ring-1 focus:ring-yellow-400 focus:border-yellow-400">
                        </div>

                        <div>
                            <label for="phone" class="block text-sm font-bold mb-2">PHONE NUMBER (For Critical SMS Alerts)</label>
                            <input type="tel" id="phone" placeholder="e.g., +1 555-123-4567" class="w-full px-4 py-3 bg-gray-800 text-white rounded-md border border-gray-700 focus:ring-1 focus:ring-yellow-400 focus:border-yellow-400">
                            <p class="text-xs text-gray-500 mt-1">SMS alerts reserved for CVSS 9.0+ vulnerabilities and global incidents.</p>
                        </div>

                        <div class="space-y-3">
                            <label class="block text-sm font-bold mb-2">ALERT CATEGORIES (Select All That Apply)</label>
                            <div class="flex items-center">
                                <input type="checkbox" id="latest-alert" name="category" value="latest" class="h-4 w-4 text-yellow-400 bg-gray-800 border-gray-600 rounded focus:ring-yellow-400">
                                <label for="latest-alert" class="ml-3 text-sm">Latest Cyber Attacks</label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="zero-day-alert" name="category" value="zero-day" class="h-4 w-4 text-yellow-400 bg-gray-800 border-gray-600 rounded focus:ring-yellow-400">
                                <label for="zero-day-alert" class="ml-3 text-sm">Zero Day Attacks</label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="ransomware-alert" name="category" value="ransomware" class="h-4 w-4 text-yellow-400 bg-gray-800 border-gray-600 rounded focus:ring-yellow-400">
                                <label for="ransomware-alert" class="ml-3 text-sm">Ransomware</label>
                            </div>
                             <div class="flex items-center">
                                <input type="checkbox" id="vulnerabilities-alert" name="category" value="vulnerabilities" class="h-4 w-4 text-yellow-400 bg-gray-800 border-gray-600 rounded focus:ring-yellow-400">
                                <label for="vulnerabilities-alert" class="ml-3 text-sm">Critical Vulnerabilities</label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="hacktivism-alert" name="category" value="hacktivism" class="h-4 w-4 text-yellow-400 bg-gray-800 border-gray-600 rounded focus:ring-yellow-400">
                                <label for="hacktivism-alert" class="ml-3 text-sm">Hacktivism</label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="regional-alert" name="category" value="regional" class="h-4 w-4 text-yellow-400 bg-gray-800 border-gray-600 rounded focus:ring-yellow-400">
                                <label for="regional-alert" class="ml-3 text-sm">Regional Cyber Threats</label>
                            </div>
                        </div>

                        <button type="submit" class="w-full py-3 bg-yellow-400 text-gray-900 font-extrabold rounded-md shadow-lg shadow-yellow-900/50 hover:bg-yellow-300 transition duration-150">
                            SECURE YOUR INTELWIRE SUBSCRIPTION
                        </button>
                    </form>
                    
                    <div id="message-box" class="mt-4 text-center p-3 bg-gray-800 border border-gray-700 rounded hidden"></div>
                </div>
            `;
            
            // Add form submission logic
            document.getElementById('subscribe-form').addEventListener('submit', function(event) {
                event.preventDefault();
                const email = document.getElementById('email').value;
                const messageBox = document.getElementById('message-box');

                messageBox.classList.remove('hidden', 'bg-red-900/50', 'text-red-300', 'border-red-700');
                messageBox.classList.add('bg-green-900/50', 'text-green-300', 'border-green-700');
                messageBox.innerHTML = `Subscription confirmed for <strong>${email}</strong>! You will start receiving critical alerts shortly.`;

                this.reset();
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 5000);
            });
        }

        /**
         * Renders a standard news section using dynamically fetched data.
         * @param {string} title - The title for the section (e.g., "Ransomware").
         * @param {string} userQuery - The specific query for the Gemini API.
         */
        async function renderNewsView(title, userQuery) {
            
            // Initial render with loading state
            contentArea.innerHTML = `
                <h2 class="text-4xl masthead-font font-bold mb-6 border-b pb-2 uppercase">${title}</h2>
                <div class="flex flex-col items-center justify-center min-h-[300px]">
                    <div class="spinner"></div>
                    <p class="mt-4 text-gray-400 text-lg">Fetching real-time intelligence for 5 articles...</p>
                </div>
            `;

            const systemPrompt = "You are a lead editor for IntelWire, a high-contrast black and white cyber security newspaper. Your task is to generate 5 distinct, recent, and highly critical news articles in JSON format for the specified category. Use Google Search to ensure the information is up-to-date and factual. Be concise, urgent, and professional. The date must be current or within the last week. The excerpt must be a maximum of 4 sentences. The output MUST be only a JSON array matching the schema.";
            
            const articles = await generateContent(userQuery, systemPrompt);

            if (!articles || articles.length === 0) {
                // Handle API failure or empty response
                contentArea.innerHTML = `
                    <h2 class="text-4xl masthead-font font-bold mb-6 border-b pb-2 uppercase">${title}</h2>
                    <div class="text-center p-6 bg-red-900/50 border border-red-700 rounded-lg">
                        <p class="text-red-300 font-bold">ERROR: Could not retrieve real-time intelligence.</p>
                        <p class="text-red-300 text-sm mt-2">The IntelWire servers are currently experiencing high traffic or the AI source failed to deliver content. Please try again in a moment.</p>
                    </div>
                `;
                return;
            }

            // Render successful articles
            let html = `<h2 class="text-4xl masthead-font font-bold mb-6 border-b pb-2 uppercase">${title}</h2>`;
            html += '<div class="content-grid">';
            
            articles.forEach(article => {
                // Sanitization to prevent XSS (although controlled input, good practice)
                const safeTitle = article.title.replace(/</g, "<").replace(/>/g, ">");
                const safeExcerpt = article.excerpt.replace(/</g, "<").replace(/>/g, ">");
                const safeDate = article.date.replace(/</g, "<").replace(/>/g, ">");

                html += `
                    <article class="newspaper-article article-column">
                        <p class="text-sm font-semibold mb-1 text-gray-400">${safeDate} | INTELWIRE EXCLUSIVE</p>
                        <h3 class="masthead-font text-2xl font-bold mb-2 hover:text-yellow-400 cursor-pointer transition duration-150">${safeTitle}</h3>
                        <p class="text-gray-200 leading-relaxed">${safeExcerpt}</p>
                        <a href="#" onclick="event.preventDefault(); console.log('Viewing full article for: ${safeTitle}');" class="text-yellow-400 hover:text-white text-sm mt-2 inline-block font-bold">[ Full Report ]</a>
                    </article>
                `;
            });
            
            html += '</div>';
            contentArea.innerHTML = html;
        }

        /**
         * Function to handle search form submission.
         */
        function handleSearch(event) {
            event.preventDefault();
            const searchTerm = document.getElementById('search-input').value.trim();
            if (searchTerm) {
                // Reroute to renderView with 'search' type and the term
                renderView('search', searchTerm);
            }
        }


        /**
         * Main routing function.
         * @param {string} viewName - The view to render.
         * @param {string} [searchTerm=null] - Optional search term for the search view.
         */
        function renderView(viewName, searchTerm = null) {
            // Remove active state from all nav buttons
            navButtons.forEach(button => {
                button.classList.remove('active');
            });
            
            // Route to the correct renderer
            if (viewName === 'subscribe') {
                document.querySelector('[data-view="subscribe"]').classList.add('active');
                renderSubscriptionView();
            } else if (viewName === 'search') {
                const title = `Search Results for: "${searchTerm}"`;
                const query = `Generate 5 articles based specifically on the search query: ${searchTerm}`;
                // No button gets active state for search results
                renderNewsView(title, query);
            } else {
                // Handle category views
                const topicMap = {
                    'latest': 'Latest Cyber Attacks',
                    'zero-day': 'Zero Day Attacks',
                    'ransomware': 'Ransomware',
                    'vulnerabilities': 'Critical Vulnerabilities',
                    'hacktivism': 'Hacktivism',
                    'regional': 'Regional Cyber Threats'
                };
                const title = topicMap[viewName];
                const query = `Generate 5 articles for the '${title}' section. Focus on the most recent and impactful news.`;

                document.querySelector(`[data-view="${viewName}"]`).classList.add('active');
                renderNewsView(title, query);
            }
        }

        // Initialize the app with the 'Latest Cyber Attacks' view
        window.onload = () => {
            renderView('latest');
        };
    </script>
</body>
</html>
